[package]
name = "vrs-cli"
version = "0.2.0"
authors = ["edison@versense.network", "shiotoli@verisense.network", "mike@verisense.network"]
edition = "2021"
license = "MIT"
homepage = "https://verisense.network"
repository = "https://github.com/verisense-network/vrs-cli"
description = "Command line tool for Verisense."

[[bin]]
name = "vrx"
path = "src/main.rs"

[dependencies]
clap = { version = "4.4", features = ["derive"] }
sp-core = { features = ["serde"], version = "34.0.0" }
subxt = { version = "0.40" }
subxt-signer = "0.40"
subxt-core = { version = "0.40" }
subxt-codegen = { version = "0.40" }
subxt-metadata = { version = "0.40" }
tokio = { version = "1.39.3", features = ["full"] }
sha2 = "0.10.6"
hex = "0.4.3"
blake2 = "0.10.6"
bs58 = "0.5.1"
home = "0.5.11"
anyhow = "1.0.95"
bip39 = { version = "2.1.0", features = ["rand"] }
itertools = "0.14.0"
console = "0.15.10"
serde_json = "1.0"

[build-dependencies]
reqwest = { version = "0.12.12", features = ["blocking"] }
